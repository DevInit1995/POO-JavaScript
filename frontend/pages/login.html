<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/frontend/img/login.png">
    <link rel="stylesheet" href="/frontend/css/login.css">
</head>

<body>
    <header>
        <nav class="cabecalho">
            <button class="btnLogin-popup">Login</button>
        </nav>
    </header>

    <div class="wrapper">
        <span class="icone-fechar">
            <ion-icon name="close"></ion-icon>
        </span>

        <div class="form-box login">
            <h2>Login</h2>

            <form action="#">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="email" required>
                    <label>Email</label>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" required>
                    <label>Senha</label>
                </div>

                <div class="relembre-senha">
                    <label><input type="checkbox">Relembre me</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btnLogon">Login</button>
            </form>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script src="/frontend/js/login.js"></script>
    <!--
    <div class="rodape">
        <footer>Copyright 2026&copy; - JHON SANTOS</footer>
    </div> -->
</body>
</html>
